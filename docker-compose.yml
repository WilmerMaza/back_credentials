name: credentials

services:
  # 🔹 Backend API (Accesible visualmente en puerto 3000)
  api:
    build:
      context: .
      args:
        BUILD_REV: ${BUILD_REV:-dev}
      labels:
        - project=credentials
    image: back-credentials:latest
    container_name: api-credentials
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres_server
      POSTGRES_PORT: "5432"
      POSTGRES_USER: admin
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://credenciales.enap.edu.co}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://credenciales.enap.edu.co,https://credenciales.enap,http://credenciales.enap.edu.co,http://credenciales.enap}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      API_PUBLIC_PREFIX: ${API_PUBLIC_PREFIX:-/api}
    restart: unless-stopped
    # API solo red interna. Público: :80 del contenedor frontend (/ y /api/*). Ver docs/SSL_CERTIFICATE.md
    expose:
      - "3000"
    # Descomentar solo para depuración local directa al backend:
    # ports:
    #   - "3000:3000"
    volumes:
      - uploads-data:/app/uploads
    networks:
      - internal
      - db
    healthcheck:
      test: ["CMD-SHELL", "PORT=$${PORT:-3000}; code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$${PORT}/docs || exit 1); [ \"$${code}\" -lt 500 ]"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: "512M"

  # 🔹 Frontend (Angular + Nginx integrado - Accesible en puerto 80)
  frontend:
    build:
      context: ../frontend_credentials_21
      args:
        BUILD_REV: ${BUILD_REV:-dev}
      labels:
        - project=credentials
    image: front-credentials:latest
    container_name: frontend-credentials
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge
  db:
    external: true
    name: db_credencial_back-network

volumes:
  uploads-data:
