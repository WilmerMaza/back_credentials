# Nginx en el SERVIDOR HOST (fuera de Docker)
# Cuando credenciales.enap.edu.co termina SSL aquí y reenvía al stack Docker en :80
#
# Instalar: sudo ln -s /ruta/back/nginx/credenciales.enap.edu.co.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

upstream credentials_frontend {
    server 127.0.0.1:80;
    keepalive 32;
}

server {
    listen 80;
    server_name credenciales.enap.edu.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name credenciales.enap.edu.co;

    # Certificados SSL (ajustar rutas según ENAP / Let's Encrypt)
    ssl_certificate     /etc/ssl/certs/credenciales.enap.edu.co.crt;
    ssl_certificate_key /etc/ssl/private/credenciales.enap.edu.co.key;

    client_max_body_size 25m;

    location / {
        proxy_pass http://credentials_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# IMPORTANTE: No apuntar /api a :3000 por separado.
# El frontend Docker ya hace proxy /api → api:3000 internamente.
# Todo el tráfico (/, /api/*) debe ir al contenedor frontend-credentials:80.
